# GLPI help desk with MariaDB. Start with: docker compose up -d
# Then open http://localhost:8080 and follow README.md.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: change-me-root
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: change-me-glpi
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  glpi:
    image: glpi/glpi:latest
    depends_on:
      - db
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: change-me-glpi
    ports:
      - "8080:80"
    volumes:
      - glpi_data:/var/glpi
    restart: unless-stopped

volumes:
  db_data:
  glpi_data:
